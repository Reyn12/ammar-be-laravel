; Pool PHP-FPM khusus backend Ammar.
; Setiap koneksi SSE (tablet kasir/dapur) memegang satu proses selama terbuka,
; jadi max_children dibuat lebih besar dari biasanya.
[ammar]
user = deploy
group = www-data
listen = /run/php/ammar.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
php_admin_value[date.timezone] = Asia/Jakarta
